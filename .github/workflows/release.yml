name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets npm verify the workflow's identity for trusted publishing, so no
      # long-lived token is needed.
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs a newer npm than Node 22 ships with.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm publish
